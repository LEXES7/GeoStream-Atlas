name: Daily collection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

env:
  # These must match a verified email on your GitHub account for the commits
  # to count toward your contribution graph.
  GIT_AUTHOR_NAME: LEXES7
  GIT_AUTHOR_EMAIL: sachinthabhashitha245@gmail.com

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Collect today's data
        id: collect
        run: python -m geostream

      - name: Commit each location and push
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          DATE="${{ steps.collect.outputs.date }}"

          while IFS=$'\t' read -r path message; do
            [ -z "$path" ] && continue
            git add "$path"
            git diff --cached --quiet || git commit -m "$message"
          done < commit_plan.tsv

          git add data
          git diff --cached --quiet || git commit -m "Daily climate summary $DATE"

          git push

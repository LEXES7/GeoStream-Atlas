name: Collect weather

on:
  schedule:
    # Every 2 hours. If API or storage pressure shows up, relax to "0 */5 * * *".
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-weather
  cancel-in-progress: false

env:
  # Must match a verified email on your GitHub account for commits to count
  # toward your contribution graph.
  GIT_AUTHOR_NAME: LEXES7
  GIT_AUTHOR_EMAIL: sachinthabhashitha245@gmail.com

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Collect current data
        id: collect
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m geostream

      - name: Commit and push
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          git add data web/public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weather update ${{ steps.collect.outputs.stamp }}"

          # Land cleanly even if the branch advanced since checkout.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying…"
            sleep 5
          done
          exit 1
